<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Multiplayer College Campus Realm</title>
  <script>
    window.onerror = function(msg, url, line) {
      console.error('JS Error: ' + msg + ' on line ' + line);
    };
  </script>
  <!-- Three.js + OrbitControls + Tween.js (Local or CDN fallback) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #05050a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; }
    #webgl-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; outline: none; }
    
    /* HUD Overlays */
    .hud-layer { position: absolute; z-index: 10; pointer-events: none; width: 100%; height: 100%; }
    .interactive { pointer-events: auto; }

    /* Top Navigation Bar */
    .top-header {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .campus-badge-btn {
      background: rgba(18, 16, 32, 0.9); backdrop-filter: blur(12px);
      border: 1px solid rgba(162, 48, 237, 0.55); border-radius: 20px;
      padding: 6px 14px; display: flex; align-items: center; gap: 8px;
      cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .campus-badge-name { font-size: 13px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    .campus-badge-tag { font-size: 9px; padding: 2px 6px; border-radius: 6px; font-weight: 700; background: rgba(16, 185, 129, 0.25); color: #10b981; border: 1px solid #10b981; }
    
    .stats-pill-group { display: flex; gap: 6px; align-items: center; }
    .stat-chip {
      background: rgba(18, 16, 32, 0.9); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px;
      padding: 6px 10px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
    }
    .stat-chip.pts { color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); }
    .stat-chip.bld { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }

    .sound-toggle-btn {
      background: rgba(18, 16, 32, 0.9); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 14px;
    }

    /* Minimap Radar Widget (Top Right below bar) */
    .radar-widget {
      position: absolute; top: 54px; right: 10px; width: 75px; height: 75px;
      background: rgba(10, 9, 20, 0.85); backdrop-filter: blur(8px);
      border: 1px solid rgba(162, 48, 237, 0.4); border-radius: 50%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5); overflow: hidden; pointer-events: auto;
    }
    .radar-canvas { width: 100%; height: 100%; }

    /* Dropdown Modal for Switching Campuses */
    .campus-modal {
      position: absolute; top: 52px; left: 10px; width: 260px;
      background: rgba(14, 13, 26, 0.96); backdrop-filter: blur(16px);
      border: 1px solid rgba(162, 48, 237, 0.6); border-radius: 16px;
      padding: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.85);
      display: none; flex-direction: column; gap: 8px; z-index: 20;
    }
    .campus-modal.open { display: flex; }
    .modal-title { font-size: 11px; text-transform: uppercase; color: #c084fc; font-weight: 800; letter-spacing: 0.8px; margin-bottom: 2px; }
    .campus-opt-btn {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .campus-opt-btn.active { background: linear-gradient(135deg, rgba(162, 48, 237, 0.4), rgba(99, 102, 241, 0.4)); border-color: #c084fc; }
    .world-view-btn {
      padding: 8px 12px; border-radius: 10px; background: rgba(99, 102, 241, 0.25);
      border: 1px solid #6366f1; color: #a5b4fc; font-size: 11px; font-weight: 800; text-align: center; cursor: pointer; text-transform: uppercase;
    }

    /* Quick View Controls Floating Pill (Left side) */
    .view-controls {
      position: absolute; top: 54px; left: 10px; display: flex; gap: 6px;
    }
    .view-btn {
      background: rgba(18, 16, 32, 0.85); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; padding: 4px 8px; font-size: 10px; font-weight: 700; color: #94a3b8;
      cursor: pointer; display: flex; align-items: center; gap: 4px;
    }
    .view-btn:active { background: rgba(162, 48, 237, 0.3); color: #fff; }

    /* Bottom Action Controls (Compact Mobile Dock) */
    .bottom-dock {
      position: absolute; bottom: 10px; left: 10px; right: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .msg-btn {
      width: 100%; padding: 10px 14px; border-radius: 14px;
      background: linear-gradient(135deg, #059669, #10b981);
      border: none; color: #fff; font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35); cursor: pointer;
    }
    .msg-btn:active { transform: scale(0.98); }

    .weapon-dock-row {
      display: flex; gap: 6px; align-items: center; justify-content: space-between;
      background: rgba(14, 13, 26, 0.92); backdrop-filter: blur(14px);
      padding: 8px 10px; border-radius: 16px; border: 1px solid rgba(162, 48, 237, 0.35);
    }
    .weapon-chip {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 6px 4px; border-radius: 10px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); cursor: pointer; min-width: 65px;
    }
    .weapon-chip.active {
      background: rgba(245, 158, 11, 0.25); border-color: #f59e0b; box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
    }
    .w-icon { font-size: 14px; }
    .w-name { font-size: 10px; font-weight: 800; color: #fff; margin-top: 1px; }
    .w-cost { font-size: 9px; color: #f59e0b; font-weight: 700; }

    .fire-action-btn {
      padding: 10px 14px; border-radius: 12px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border: none; color: #fff; font-size: 12px; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap;
    }
    .fire-action-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Slide-Up Building Inspector Sheet */
    .inspector-sheet {
      position: absolute; bottom: 120px; left: 10px; right: 10px; max-width: 360px; margin: 0 auto;
      background: rgba(14, 13, 26, 0.96); backdrop-filter: blur(16px);
      border: 1px solid rgba(162, 48, 237, 0.5); border-radius: 18px;
      padding: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.85); display: none;
    }
    .inspector-sheet.open { display: block; }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .sheet-title { font-size: 14px; font-weight: 800; color: #fff; }
    .sheet-close { background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; padding: 0 4px; }
    .sheet-campus { font-size: 11px; color: #c084fc; font-weight: 700; margin-bottom: 8px; }
    .hp-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
    .hp-bar-fill { height: 100%; background: #10b981; transition: width 0.3s; width: 100%; }
    .hp-bar-fill.damaged { background: #f59e0b; }
    .hp-bar-fill.destroyed { background: #ef4444; }
    .hp-row { display: flex; justify-content: space-between; font-size: 11px; color: #cbd5e1; margin-bottom: 8px; }
    .repair-btn {
      width: 100%; padding: 8px; border-radius: 10px; background: rgba(16, 185, 129, 0.25);
      border: 1px solid #10b981; color: #6ee7b7; font-size: 12px; font-weight: 800; cursor: pointer;
    }

    /* Subtle Notification Ticker */
    .ticker {
      position: absolute; bottom: 82px; left: 14px; right: 14px;
      text-align: center; font-size: 11px; color: #94a3b8; pointer-events: none;
      background: rgba(0,0,0,0.45); padding: 4px 8px; border-radius: 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <div class="hud-layer">
    <!-- Top Bar -->
    <div class="top-header interactive">
      <div class="campus-badge-btn" id="campus-badge-btn">
        <span class="campus-badge-name" id="badge-campus-name">CSE-1 Campus</span>
        <span class="campus-badge-tag" id="badge-campus-tag">MY BASE</span>
        <span style="font-size: 10px; color: #c084fc;">▾</span>
      </div>

      <div class="stats-pill-group">
        <div class="stat-chip pts" title="Personal Balance">
          <span>💰</span>
          <span id="hud-pts">100 PTS</span>
        </div>
        <div class="stat-chip bld" title="Shared Construction Progress">
          <span>🧱</span>
          <span id="hud-units">18 UNITS</span>
        </div>
        <button class="sound-toggle-btn" id="btn-sound" title="Sound FX">🔊</button>
      </div>
    </div>

    <!-- Quick View Controls -->
    <div class="view-controls interactive">
      <button class="view-btn" id="btn-my-campus">🏛️ My Base</button>
      <button class="view-btn" id="btn-quick-world">🌐 World</button>
      <button class="view-btn" id="btn-tour">🔄 Orbit</button>
    </div>

    <!-- Minimap Radar Widget -->
    <div class="radar-widget interactive" id="radar-widget" title="Tactical Radar">
      <canvas class="radar-canvas" id="radar-canvas" width="75" height="75"></canvas>
    </div>

    <!-- Campus Dropdown Selector Modal (Hidden by default!) -->
    <div class="campus-modal interactive" id="campus-modal">
      <div class="modal-title">Collegiate Territory Radar</div>
      <div id="modal-campus-options" style="display: flex; flex-direction: column; gap: 6px;"></div>
      <div class="world-view-btn" id="modal-world-btn">🌐 View Entire Realm</div>
    </div>

    <!-- Live Event Ticker -->
    <div class="ticker" id="event-ticker">
      ✨ 3D Continuous World active. Drag to orbit, pinch to zoom!
    </div>

    <!-- Building Inspector Bottom Sheet -->
    <div class="inspector-sheet interactive" id="inspector-sheet">
      <div class="sheet-header">
        <span class="sheet-title" id="insp-name">Academic Main Hall</span>
        <button class="sheet-close" id="insp-close">✕</button>
      </div>
      <div class="sheet-campus" id="insp-campus">CSE-1 Campus (My Base)</div>
      <div class="hp-bar-bg">
        <div class="hp-bar-fill" id="insp-hp-bar"></div>
      </div>
      <div class="hp-row">
        <span>Structural Integrity</span>
        <span id="insp-hp-text">100 / 100 HP</span>
      </div>
      <div id="insp-action-slot"></div>
    </div>

    <!-- Bottom Action Dock -->
    <div class="bottom-dock interactive">
      <button class="msg-btn" id="btn-msg">
        <span>💬</span>
        <span>SEND 5 MESSAGES (+10 PTS & +1 CHUNK)</span>
      </button>

      <div class="weapon-dock-row">
        <div class="weapon-chip active" data-w="GUN" data-cost="50" data-dmg="30">
          <span class="w-icon">🔫</span>
          <span class="w-name">Plasma</span>
          <span class="w-cost">50p</span>
        </div>
        <div class="weapon-chip" data-w="SMALL_MISSILE" data-cost="150" data-dmg="60">
          <span class="w-icon">🚀</span>
          <span class="w-name">Missile</span>
          <span class="w-cost">150p</span>
        </div>
        <div class="weapon-chip" data-w="BIG_MISSILE" data-cost="400" data-dmg="120">
          <span class="w-icon">⚡</span>
          <span class="w-name">ICBM</span>
          <span class="w-cost">400p</span>
        </div>

        <button class="fire-action-btn" id="btn-fire" disabled>
          <span>🎯</span>
          <span>STRIKE</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. PROCEDURAL SOUND SYNTHESIS (Zero External Audio Assets!)
    // =========================================================================
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      if (type === 'click') {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'launch') {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(480, now + 0.8);
        g.gain.setValueAtTime(0.3, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.8);
      } else if (type === 'explosion') {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.6);
        g.gain.setValueAtTime(0.6, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.6);
      } else if (type === 'build') {
        const notes = [440, 554, 659, 880];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          g.gain.setValueAtTime(0.15, now + idx * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.15);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.15);
        });
      } else if (type === 'repair') {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.35);
        g.gain.setValueAtTime(0.25, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.35);
      }
    }

    document.getElementById('btn-sound').onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('btn-sound').innerText = soundEnabled ? '🔊' : '🔇';
    };

    // =========================================================================
    // 2. DATA & CAMPUS CONFIGURATION
    // =========================================================================
    let userPoints = 100;
    const mySectionId = "CSE-1";

    const SECTIONS = [
      { id: "CSE-1", name: "CSE-1 Campus", color: 0x3b82f6, isMySection: true, angle: 0, distance: 75 },
      { id: "CSE-2", name: "CSE-2 Campus", color: 0xef4444, isMySection: false, angle: (2 * Math.PI) / 3, distance: 75 },
      { id: "ECE-1", name: "ECE-1 Campus", color: 0x10b981, isMySection: false, angle: (4 * Math.PI) / 3, distance: 75 }
    ];

    const TEMPLATES = [
      { key: "MAIN_HALL", name: "Genesis Academic Citadel", maxHp: 100, req: 8, x: 0, z: 0, size: [16, 13, 14], type: 'hall' },
      { key: "LIBRARY", name: "Tech Clock Tower", maxHp: 80, req: 6, x: 13, z: -8, size: [8, 24, 8], type: 'tower' },
      { key: "CANTEEN", name: "Rogue Bar Canteen", maxHp: 60, req: 6, x: -13, z: -8, size: [12, 7, 12], type: 'canteen' },
      { key: "LAB", name: "Cyber AI Innovation Lab", maxHp: 80, req: 6, x: -11, z: 11, size: [10, 8, 10], type: 'lab' },
      { key: "GARDEN", name: "Courtyard & Fountain", maxHp: 40, req: 4, x: 11, z: 11, size: [10, 3, 10], type: 'garden' },
      { key: "TURRET", name: "Defense Laser Battery", maxHp: 120, req: 10, x: 0, z: 18, size: [8, 9, 6], type: 'turret' }
    ];

    const campuses = {};
    SECTIONS.forEach(s => {
      campuses[s.id] = {
        config: s,
        msgCount: s.isMySection ? 3 : 15,
        units: s.isMySection ? 18 : 22,
        structures: TEMPLATES.map((t, idx) => {
          let status = 'INTACT';
          let placed = t.req;
          let hp = t.maxHp;

          if (s.isMySection) {
            if (idx === 4) { status = 'BUILDING'; placed = 2; hp = 20; }
            else if (idx === 5) { status = 'LOCKED'; placed = 0; hp = 0; }
          } else if (s.id === 'CSE-2') {
            if (idx === 0) { status = 'DAMAGED'; hp = 45; }
            else if (idx === 5) { status = 'DESTROYED'; hp = 0; placed = 0; }
          }
          return { ...t, status, hp, placed, mesh: null };
        }),
        group: null,
        shieldMesh: null
      };
    });

    let currentCampusId = "CSE-1";
    let selectedBuilding = null;
    let selectedWeapon = { type: 'GUN', cost: 50, dmg: 30 };
    let isAutoTour = false;

    // =========================================================================
    // 3. THREE.JS 3D SCENE SETUP
    // =========================================================================
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05050a);
    scene.fog = new THREE.FogExp2(0x05050a, 0.0035);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1500);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 20;
    controls.maxDistance = 350;

    // Starfield Atmosphere
    const starsGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for (let i = 0; i < 2000; i++) {
      starCoords.push((Math.random() - 0.5) * 1200, Math.random() * 600 + 40, (Math.random() - 0.5) * 1200);
    }
    starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0x93c5fd, size: 1.4 })));

    // Dynamic Lighting
    scene.add(new THREE.AmbientLight(0x403d5c, 2.2));
    const sun = new THREE.DirectionalLight(0xe0e7ff, 2.5);
    sun.position.set(90, 180, 90);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    scene.add(sun);

    // =========================================================================
    // 4. CENTRAL CITADEL HUB
    // =========================================================================
    const hub = new THREE.Group();
    const pillar = new THREE.Mesh(
      new THREE.CylinderGeometry(14, 18, 20, 16),
      new THREE.MeshStandardMaterial({ color: 0x161528, roughness: 0.3, metalness: 0.6 })
    );
    pillar.position.y = -10;
    hub.add(pillar);

    const orb = new THREE.Mesh(
      new THREE.SphereGeometry(6, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xa230ed, emissive: 0xa230ed, emissiveIntensity: 0.8, roughness: 0.2 })
    );
    orb.position.y = 8;
    hub.add(orb);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(11, 0.6, 16, 64),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
    );
    ring.position.y = 8;
    ring.rotation.x = Math.PI / 2.3;
    hub.add(ring);
    hub.userData.ring = ring;
    scene.add(hub);

    // =========================================================================
    // 5. DETAILED ARCHITECTURAL GENERATION & ENHANCED ISLANDS
    // =========================================================================
    const clickables = [];
    const activeParticles = [];
    const activeShuttles = [];

    function buildCampuses() {
      SECTIONS.forEach(s => {
        const cData = campuses[s.id];
        const group = new THREE.Group();
        cData.group = group;

        const posX = Math.cos(s.angle) * s.distance;
        const posZ = Math.sin(s.angle) * s.distance;
        group.position.set(posX, 0, posZ);

        // Island Foundation (Upper stone platform + Lower tech hull)
        const islandTop = new THREE.Mesh(
          new THREE.CylinderGeometry(28, 25, 6, 6),
          new THREE.MeshStandardMaterial({ color: 0x181829, metalness: 0.5, roughness: 0.35 })
        );
        islandTop.position.y = -3;
        islandTop.receiveShadow = true;
        group.add(islandTop);

        const islandHull = new THREE.Mesh(
          new THREE.CylinderGeometry(25, 8, 12, 6),
          new THREE.MeshStandardMaterial({ color: 0x0f0e1a, metalness: 0.7, roughness: 0.3 })
        );
        islandHull.position.y = -12;
        group.add(islandHull);

        // Glowing Anti-Gravity Thruster Ring underneath
        const thruster = new THREE.Mesh(
          new THREE.TorusGeometry(12, 0.8, 16, 32),
          new THREE.MeshBasicMaterial({ color: s.color })
        );
        thruster.position.y = -9;
        thruster.rotation.x = Math.PI / 2;
        group.add(thruster);

        // Glowing Trim
        const trim = new THREE.Mesh(
          new THREE.CylinderGeometry(28.3, 28.3, 0.6, 6),
          new THREE.MeshBasicMaterial({ color: s.color })
        );
        trim.position.y = 0.1;
        group.add(trim);

        // Translucent Energy Forcefield Shield Dome
        const shield = new THREE.Mesh(
          new THREE.SphereGeometry(30, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2),
          new THREE.MeshBasicMaterial({ color: s.color, wireframe: true, transparent: true, opacity: 0.14 })
        );
        group.add(shield);
        cData.shieldMesh = shield;

        // Paved Walkways (Intersecting Cross)
        const road1 = new THREE.Mesh(new THREE.PlaneGeometry(6, 44), new THREE.MeshStandardMaterial({ color: 0x27273a, roughness: 0.8 }));
        road1.rotation.x = -Math.PI / 2; road1.position.y = 0.05; group.add(road1);
        const road2 = road1.clone(); road2.rotation.z = Math.PI / 2; group.add(road2);

        // Buildings
        cData.structures.forEach(st => {
          const bMesh = createBldg(st, s.color);
          bMesh.position.set(st.x, 0, st.z);
          group.add(bMesh);
          st.mesh = bMesh;

          bMesh.traverse(child => {
            if (child.isMesh) {
              child.userData = { sectionId: s.id, struct: st };
              clickables.push(child);
            }
          });
        });

        scene.add(group);
      });
    }

    function createBldg(st, col) {
      const g = new THREE.Group();

      if (st.status === 'LOCKED') {
        const grid = new THREE.Mesh(
          new THREE.PlaneGeometry(st.size[0], st.size[2]),
          new THREE.MeshBasicMaterial({ color: 0x475569, wireframe: true })
        );
        grid.rotation.x = -Math.PI / 2; grid.position.y = 0.1; g.add(grid);
        return g;
      }

      if (st.status === 'BUILDING') {
        const scaf = new THREE.Mesh(
          new THREE.BoxGeometry(st.size[0], st.size[1], st.size[2]),
          new THREE.MeshBasicMaterial({ color: 0xf59e0b, wireframe: true, transparent: true, opacity: 0.6 })
        );
        scaf.position.y = st.size[1] / 2; g.add(scaf);

        const curH = st.size[1] * (st.placed / st.req);
        const core = new THREE.Mesh(
          new THREE.BoxGeometry(st.size[0] * 0.9, Math.max(1, curH), st.size[2] * 0.9),
          new THREE.MeshStandardMaterial({ color: 0x334155 })
        );
        core.position.y = curH / 2; g.add(core);

        // Laser scan beam
        const beam = new THREE.Mesh(
          new THREE.CylinderGeometry(0.2, 0.2, st.size[1]),
          new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
        );
        beam.position.set(0, st.size[1] / 2, 0); g.add(beam);
        return g;
      }

      const isDes = st.status === 'DESTROYED';
      const isDam = st.status === 'DAMAGED';

      const wallCol = isDes ? 0x27272a : (isDam ? 0x475569 : 0x1e1b4b);
      const winCol = isDes ? 0x18181b : (isDam ? 0xef4444 : 0x38bdf8);

      // Base Structure
      const main = new THREE.Mesh(
        new THREE.BoxGeometry(st.size[0], st.size[1], st.size[2]),
        new THREE.MeshStandardMaterial({ color: wallCol, metalness: 0.45, roughness: 0.35 })
      );
      main.position.y = st.size[1] / 2; main.castShadow = true; main.receiveShadow = true;
      g.add(main);

      // Emissive Windows
      const win = new THREE.Mesh(
        new THREE.BoxGeometry(st.size[0] * 1.02, st.size[1] * 0.45, st.size[2] * 0.8),
        new THREE.MeshStandardMaterial({ color: winCol, emissive: winCol, emissiveIntensity: isDes ? 0 : 0.65 })
      );
      win.position.y = st.size[1] * 0.6; g.add(win);

      // Unique Architectural Landmarks
      if (st.type === 'tower') {
        const roof = new THREE.Mesh(
          new THREE.ConeGeometry(5, 8, 4),
          new THREE.MeshStandardMaterial({ color: col, metalness: 0.6 })
        );
        roof.position.y = st.size[1] + 4; roof.rotation.y = Math.PI / 4; g.add(roof);

        // Digital Clock Face on 4 sides
        const clockOrb = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
        clockOrb.position.y = st.size[1] - 2; g.add(clockOrb);
      } else if (st.type === 'hall') {
        const dome = new THREE.Mesh(
          new THREE.SphereGeometry(4.5, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2),
          new THREE.MeshStandardMaterial({ color: 0x6366f1, roughness: 0.2 })
        );
        dome.position.y = st.size[1]; g.add(dome);

        // Rotating Holographic Emblem
        const holo = new THREE.Mesh(new THREE.OctahedronGeometry(1.6), new THREE.MeshBasicMaterial({ color: 0xa230ed, wireframe: true }));
        holo.position.y = st.size[1] + 6; g.add(holo);
        g.userData.holo = holo;
      } else if (st.type === 'canteen') {
        const canopy = new THREE.Mesh(new THREE.BoxGeometry(st.size[0] + 4, 0.6, 6), new THREE.MeshStandardMaterial({ color: 0xf59e0b }));
        canopy.position.set(0, st.size[1] * 0.5, st.size[2] / 2 + 3); g.add(canopy);
      } else if (st.type === 'turret') {
        const barrel1 = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 6), new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.8 }));
        barrel1.position.set(-1.4, st.size[1] + 2, 2); barrel1.rotation.x = Math.PI / 3; g.add(barrel1);
        const barrel2 = barrel1.clone(); barrel2.position.x = 1.4; g.add(barrel2);
      } else if (st.type === 'garden') {
        // Holographic fountain
        const fount = new THREE.Mesh(new THREE.TorusGeometry(2, 0.4, 8, 16), new THREE.MeshBasicMaterial({ color: 0x06b6d4 }));
        fount.rotation.x = Math.PI / 2; fount.position.y = 0.5; g.add(fount);
      }

      if (isDam || isDes) {
        addDamageFX(g, st);
      }

      return g;
    }

    function addDamageFX(g, st) {
      const crater = new THREE.Mesh(
        new THREE.CylinderGeometry(st.size[0] * 0.35, st.size[0] * 0.4, 0.4, 8),
        new THREE.MeshBasicMaterial({ color: 0x09090b })
      );
      crater.position.set(0, st.size[1] + 0.1, 0); g.add(crater);

      const sCount = st.status === 'DESTROYED' ? 22 : 12;
      const sGeo = new THREE.DodecahedronGeometry(1.0, 1);
      const sMat = new THREE.MeshBasicMaterial({ color: 0x27272a, transparent: true, opacity: 0.6 });

      for (let i = 0; i < sCount; i++) {
        const s = new THREE.Mesh(sGeo, sMat.clone());
        s.position.set((Math.random() - 0.5) * st.size[0] * 0.5, st.size[1] + Math.random() * 3, (Math.random() - 0.5) * st.size[2] * 0.5);
        s.userData = { baseY: st.size[1], speedY: 0.1 + Math.random() * 0.15, maxH: 14 + Math.random() * 8 };
        g.add(s); activeParticles.push(s);
      }
    }

    // Flying Drone Shuttles
    function createShuttles() {
      for (let i = 0; i < 3; i++) {
        const sMesh = new THREE.Mesh(
          new THREE.ConeGeometry(0.8, 2.5, 4),
          new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
        );
        sMesh.rotation.x = Math.PI / 2;
        scene.add(sMesh);
        activeShuttles.push({ mesh: sMesh, angle: (i * Math.PI * 2) / 3, speed: 0.008 + i * 0.003, radius: 45 + i * 15, height: 12 + i * 4 });
      }
    }
    createShuttles();

    // =========================================================================
    // 6. CAMERA & NAVIGATION MODES
    // =========================================================================
    function setFocusCampus(id, instant = false) {
      isAutoTour = false;
      currentCampusId = id;
      const c = campuses[id];
      const p = c.group.position;

      document.getElementById('badge-campus-name').innerText = c.config.name;
      const tag = document.getElementById('badge-campus-tag');
      tag.innerText = c.config.isMySection ? 'MY BASE' : 'RIVAL';
      tag.style.color = c.config.isMySection ? '#10b981' : '#ef4444';
      tag.style.borderColor = c.config.isMySection ? '#10b981' : '#ef4444';

      if (instant) {
        controls.target.set(p.x, 6, p.z);
        camera.position.set(p.x, 34, p.z + 55);
        controls.update();
      } else {
        new TWEEN.Tween(controls.target)
          .to({ x: p.x, y: 6, z: p.z }, 900)
          .easing(TWEEN.Easing.Cubic.Out)
          .start();

        new TWEEN.Tween(camera.position)
          .to({ x: p.x, y: 34, z: p.z + 55 }, 900)
          .easing(TWEEN.Easing.Cubic.Out)
          .start();
      }
      closeModal();
    }

    function viewWorld() {
      isAutoTour = false;
      new TWEEN.Tween(controls.target)
        .to({ x: 0, y: 8, z: 0 }, 1000)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(camera.position)
        .to({ x: 0, y: 130, z: 180 }, 1000)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();
      closeModal();
    }

    // Modal toggle
    const modal = document.getElementById('campus-modal');
    document.getElementById('campus-badge-btn').onclick = () => { playSound('click'); modal.classList.toggle('open'); };
    function closeModal() { modal.classList.remove('open'); }

    // Quick View Buttons
    document.getElementById('btn-my-campus').onclick = () => { playSound('click'); setFocusCampus(mySectionId); };
    document.getElementById('btn-quick-world').onclick = () => { playSound('click'); viewWorld(); };
    document.getElementById('btn-tour').onclick = () => {
      playSound('click');
      isAutoTour = !isAutoTour;
      ticker(isAutoTour ? '🔄 Auto Orbit Tour Activated' : '⏹️ Auto Orbit Tour Paused');
    };

    // =========================================================================
    // 7. SELECTION & WEAPONS BATTLE
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.interactive')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(clickables, true);

      if (hits.length > 0 && hits[0].object.userData.struct) {
        playSound('click');
        onSelectBldg(hits[0].object.userData.struct, hits[0].object.userData.sectionId);
      }
    });

    function onSelectBldg(st, secId) {
      selectedBuilding = { struct: st, sectionId: secId };
      const sheet = document.getElementById('inspector-sheet');
      sheet.classList.add('open');

      document.getElementById('insp-name').innerText = st.name;
      document.getElementById('insp-campus').innerText = `${secId} Campus (${secId === mySectionId ? 'My Base' : 'Rival Territory'})`;

      const pct = Math.round((st.hp / st.maxHp) * 100);
      const bar = document.getElementById('insp-hp-bar');
      bar.style.width = pct + '%';
      bar.className = 'hp-bar-fill' + (st.hp < st.maxHp * 0.4 ? ' destroyed' : (st.hp < st.maxHp ? ' damaged' : ''));
      document.getElementById('insp-hp-text').innerText = `${st.hp} / ${st.maxHp} HP (${st.status})`;

      const slot = document.getElementById('insp-action-slot');
      slot.innerHTML = '';
      if (secId === mySectionId && (st.status === 'DAMAGED' || st.status === 'DESTROYED')) {
        const repBtn = document.createElement('button');
        repBtn.className = 'repair-btn';
        repBtn.innerText = '🧯 Extinguish Fire & Repair (+40 HP)';
        repBtn.onclick = () => {
          playSound('repair');
          st.hp = Math.min(st.maxHp, st.hp + 40);
          if (st.hp >= st.maxHp) st.status = 'INTACT';
          else st.status = 'DAMAGED';
          refreshBldg(secId, st);
          onSelectBldg(st, secId);
          ticker(`🔧 Extinguished fires on ${st.name}! Restored to ${st.hp} HP.`);
        };
        slot.appendChild(repBtn);
      }

      const fireBtn = document.getElementById('btn-fire');
      fireBtn.disabled = (secId === mySectionId || st.status === 'DESTROYED' || st.status === 'LOCKED');
    }

    document.getElementById('insp-close').onclick = () => {
      playSound('click');
      document.getElementById('inspector-sheet').classList.remove('open');
    };

    function refreshBldg(secId, st) {
      const c = campuses[secId];
      if (st.mesh) c.group.remove(st.mesh);
      const newM = createBldg(st, c.config.color);
      newM.position.set(st.x, 0, st.z);
      c.group.add(newM);
      st.mesh = newM;

      newM.traverse(child => {
        if (child.isMesh) {
          child.userData = { sectionId: secId, struct: st };
          clickables.push(child);
        }
      });
    }

    // Message Building Simulation
    document.getElementById('btn-msg').onclick = () => {
      playSound('build');
      userPoints += 10;
      const myC = campuses[mySectionId];
      myC.msgCount += 5;
      myC.units += 1;
      updateHUD();

      const proj = myC.structures.find(s => s.status === 'BUILDING') || myC.structures.find(s => s.status === 'LOCKED');
      if (proj) {
        if (proj.status === 'LOCKED') {
          proj.status = 'BUILDING'; proj.placed = 1;
        } else {
          proj.placed += 1;
        }
        if (proj.placed >= proj.req) {
          proj.status = 'INTACT'; proj.hp = proj.maxHp;
          ticker(`🏗️ COMPLETED: ${proj.name} is fully operational!`);
        } else {
          ticker(`🔨 Assembled chunk on ${proj.name}: ${proj.placed}/${proj.req} units.`);
        }
        refreshBldg(mySectionId, proj);
      }
    };

    // Weapon selection
    document.querySelectorAll('.weapon-chip').forEach(chip => {
      chip.onclick = () => {
        playSound('click');
        document.querySelectorAll('.weapon-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        selectedWeapon = {
          type: chip.dataset.w,
          cost: parseInt(chip.dataset.cost),
          dmg: parseInt(chip.dataset.dmg)
        };
      };
    });

    // Fire Strike
    document.getElementById('btn-fire').onclick = () => {
      if (!selectedBuilding) return;
      if (userPoints < selectedWeapon.cost) {
        alert(`Need ${selectedWeapon.cost} PTS! Chat to earn points.`);
        return;
      }
      userPoints -= selectedWeapon.cost;
      updateHUD();
      fireProjectile(mySectionId, selectedBuilding.sectionId, selectedBuilding.struct);
    };

    function fireProjectile(fromSec, toSec, st) {
      playSound('launch');
      const fromP = campuses[fromSec].group.position;
      const toP = campuses[toSec].group.position;

      const p0 = new THREE.Vector3(fromP.x, 10, fromP.z);
      const p2 = new THREE.Vector3(toP.x + st.x, st.size[1] / 2, toP.z + st.z);
      const p1 = new THREE.Vector3().addVectors(p0, p2).multiplyScalar(0.5);
      p1.y += 50;

      const missile = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35, 0.35, 3),
        new THREE.MeshBasicMaterial({ color: 0xf59e0b })
      );
      scene.add(missile);

      ticker(`🚀 Launched ${selectedWeapon.type} at ${st.name} [${toSec}]!`);

      const tObj = { t: 0 };
      new TWEEN.Tween(tObj)
        .to({ t: 1 }, 1000)
        .onUpdate(() => {
          const t = tObj.t;
          const pos = new THREE.Vector3()
            .copy(p0).multiplyScalar((1 - t) * (1 - t))
            .add(p1.clone().multiplyScalar(2 * (1 - t) * t))
            .add(p2.clone().multiplyScalar(t * t));
          missile.position.copy(pos);
          missile.lookAt(p2);
          missile.rotateX(Math.PI / 2);
        })
        .onComplete(() => {
          scene.remove(missile);
          playSound('explosion');

          // Impact Flash Sphere
          const flash = new THREE.Mesh(
            new THREE.SphereGeometry(3, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffedd5, transparent: true, opacity: 1 })
          );
          flash.position.copy(p2);
          scene.add(flash);
          new TWEEN.Tween(flash.scale).to({ x: 5, y: 5, z: 5 }, 250).start();
          new TWEEN.Tween(flash.material).to({ opacity: 0 }, 250).onComplete(() => scene.remove(flash)).start();

          // Forcefield Shield Ripple Effect
          const targetShield = campuses[toSec].shieldMesh;
          if (targetShield) {
            targetShield.material.opacity = 0.55;
            new TWEEN.Tween(targetShield.material).to({ opacity: 0.14 }, 600).start();
          }

          // Damage
          st.hp = Math.max(0, st.hp - selectedWeapon.dmg);
          if (st.hp === 0) {
            st.status = 'DESTROYED';
            ticker(`💥 CRITICAL! ${st.name} on ${toSec} has collapsed!`);
          } else {
            st.status = 'DAMAGED';
            ticker(`⚡ Direct Hit! Dealt ${selectedWeapon.dmg} damage to ${st.name}.`);
          }
          refreshBldg(toSec, st);
          if (selectedBuilding && selectedBuilding.struct.key === st.key) {
            onSelectBldg(st, toSec);
          }
        })
        .start();
    }

    // =========================================================================
    // 8. TACTICAL RADAR MINIMAP
    // =========================================================================
    const radarCanvas = document.getElementById('radar-canvas');
    const rCtx = radarCanvas.getContext('2d');

    function renderRadar() {
      rCtx.clearRect(0, 0, 75, 75);
      rCtx.fillStyle = 'rgba(10, 9, 20, 0.9)';
      rCtx.fillRect(0, 0, 75, 75);

      // Radar Grid
      rCtx.strokeStyle = 'rgba(162, 48, 237, 0.3)';
      rCtx.lineWidth = 1;
      rCtx.beginPath();
      rCtx.arc(37.5, 37.5, 34, 0, Math.PI * 2);
      rCtx.arc(37.5, 37.5, 20, 0, Math.PI * 2);
      rCtx.stroke();

      // Central Hub Dot
      rCtx.fillStyle = '#a230ed';
      rCtx.beginPath(); rCtx.arc(37.5, 37.5, 2.5, 0, Math.PI * 2); rCtx.fill();

      // Section Dots
      SECTIONS.forEach(s => {
        const cX = 37.5 + Math.cos(s.angle) * 22;
        const cY = 37.5 + Math.sin(s.angle) * 22;
        rCtx.fillStyle = '#' + s.color.toString(16).padStart(6, '0');
        rCtx.beginPath(); rCtx.arc(cX, cY, s.id === currentCampusId ? 4 : 2.5, 0, Math.PI * 2); rCtx.fill();
      });
    }

    function updateHUD() {
      document.getElementById('hud-pts').innerText = `${userPoints} PTS`;
      document.getElementById('hud-units').innerText = `${campuses[mySectionId].units} UNITS`;
    }

    function ticker(msg) {
      document.getElementById('event-ticker').innerText = msg;
    }

    function initUI() {
      const slot = document.getElementById('modal-campus-options');
      SECTIONS.forEach(s => {
        const btn = document.createElement('div');
        btn.className = 'campus-opt-btn' + (s.id === currentCampusId ? ' active' : '');
        btn.innerHTML = `<span>${s.name}</span><span style="font-size: 10px; color: ${s.isMySection ? '#10b981' : '#ef4444'}">${s.isMySection ? 'MY BASE' : 'RIVAL'}</span>`;
        btn.onclick = () => { playSound('click'); setFocusCampus(s.id); };
        slot.appendChild(btn);
      });
      document.getElementById('modal-world-btn').onclick = () => { playSound('click'); viewWorld(); };
      updateHUD();
      renderRadar();
    }

    // =========================================================================
    // 9. ANIMATION LOOP & STARTUP
    // =========================================================================
    buildCampuses();
    initUI();
    setFocusCampus("CSE-1", true);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();

      const time = clock.getElapsedTime();

      // Auto Orbit Tour
      if (isAutoTour) {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.0;
      } else {
        controls.autoRotate = false;
      }

      // Rotate Citadel Ring
      if (hub.userData.ring) hub.userData.ring.rotation.z += 0.015;

      // Animate Shuttles
      activeShuttles.forEach(s => {
        s.angle += s.speed;
        s.mesh.position.set(Math.cos(s.angle) * s.radius, s.height, Math.sin(s.angle) * s.radius);
        s.mesh.lookAt(Math.cos(s.angle + 0.1) * s.radius, s.height, Math.sin(s.angle + 0.1) * s.radius);
      });

      // Animate Smoke Particles
      for (let i = 0; i < activeParticles.length; i++) {
        const p = activeParticles[i];
        p.position.y += p.userData.speedY;
        p.scale.addScalar(0.008);
        if (p.position.y > p.userData.baseY + p.userData.maxH) {
          p.position.y = p.userData.baseY + 1;
          p.scale.set(1, 1, 1);
        }
      }

      renderRadar();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
